name: Build Apple Silicon

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-apple-silicon:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install CocoaPods
      run: |
        gem install cocoapods --no-document
        pod install

    - name: Patch CircularProgressMac for Swift 5+ compatibility
      run: |
        FILE="Pods/CircularProgressMac/Sources/CircularProgress/util.swift"
        if [ -f "$FILE" ]; then
          python3 << 'PYEOF'
with open("Pods/CircularProgressMac/Sources/CircularProgress/util.swift", "r") as f:
    lines = f.readlines()
with open("Pods/CircularProgressMac/Sources/CircularProgress/util.swift", "w") as f:
    inserted = False
    i = 0
    while i < len(lines):
        f.write(lines[i])
        if ".closeSubpath:" in lines[i] and not inserted:
            i += 1
            if i < len(lines):
                f.write(lines[i])
            f.write("                        case .cubicCurveTo:\n")
            f.write("                            break\n")
            f.write("                        case .quadraticCurveTo:\n")
            f.write("                            break\n")
            inserted = True
        i += 1
PYEOF
        fi

    - name: Build for Apple Silicon (arm64)
      run: |
        xcodebuild -workspace SplitNSP-Swift-GUI.xcworkspace \
          -scheme SplitNSP-Swift-GUI \
          -destination 'platform=macOS,arch=arm64' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          MACOSX_DEPLOYMENT_TARGET=14.0 \
          build

    - name: Archive build
      uses: actions/upload-artifact@v4
      with:
        name: SplitNSP-Swift-GUI-arm64
        path: build/Products/Release/*.app

    - name: Create GitHub Release (auto on success)
      if: success()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Only create a new release if this is a push to master/main
        gh release create "v${{ github.run_number }}-arm64" \
          --repo cometmcisaac/SplitNSP-Swift-GUI \
          --title "Apple Silicon Build v${{ github.run_number }}" \
          --notes "Auto-release for Apple Silicon (arm64) build on macOS 14.0+" \
          --prerelease \
          build/Products/Release/*.app || echo "Release creation skipped or artifact missing"
