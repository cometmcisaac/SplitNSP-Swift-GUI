name: Build Apple Silicon

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-apple-silicon:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install CocoaPods
      run: |
        gem install cocoapods --no-document
        pod install

    - name: Patch CircularProgressMac for Swift 5+ compatibility
      run: |
        FILE="Pods/CircularProgressMac/Sources/CircularProgress/util.swift"
        if [ -f "$FILE" ]; then
          chmod +w "$FILE"
          echo 'with open("Pods/CircularProgressMac/Sources/CircularProgress/util.swift", "r") as f: content = f.read()' > /tmp/patch.py
          echo 'old = ".closeSubpath:\n                            break"' >> /tmp/patch.py
          echo 'new = ".closeSubpath:\n                            break\n                        case .cubicCurveTo:\n                            break\n                        case .quadraticCurveTo:\n                            break"' >> /tmp/patch.py
          echo 'if ".closeSubpath:" in content: content = content.replace(old, new)' >> /tmp/patch.py
          echo 'with open("Pods/CircularProgressMac/Sources/CircularProgress/util.swift", "w") as f: f.write(content)' >> /tmp/patch.py
          echo 'print("patched util.swift")' >> /tmp/patch.py
          python3 /tmp/patch.py
        fi

    - name: Build for Apple Silicon (arm64)
      run: |
        xcodebuild -workspace SplitNSP-Swift-GUI.xcworkspace \
          -scheme SplitNSP-Swift-GUI \
          -destination 'platform=macOS,arch=arm64' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          MACOSX_DEPLOYMENT_TARGET=14.0 \
          build

    - name: Archive build
      uses: actions/upload-artifact@v4
      with:
        name: SplitNSP-Swift-GUI-arm64
        path: build/Products/Release/*.app

    - name: Create GitHub Release (auto on success)
      if: success()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Only create a new release if this is a push to master/main
        gh release create "v${{ github.run_number }}-arm64" \
          --repo cometmcisaac/SplitNSP-Swift-GUI \
          --title "Apple Silicon Build v${{ github.run_number }}" \
          --notes "Auto-release for Apple Silicon (arm64) build on macOS 14.0+" \
          --prerelease \
          build/Products/Release/*.app || echo "Release creation skipped or artifact missing"
# trigger
